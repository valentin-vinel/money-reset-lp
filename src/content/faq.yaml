# ─────────────────────────────────────────────────────────────
#  FAQ
#  • pages: liste des pages où la question apparaît
#    (google-sheets = la landing)
#  • brouillon: true → la question est masquée
#  • **texte** → texte en gras
# ─────────────────────────────────────────────────────────────

- id: savoir-google-sheets
  ordre: 1
  pages: [google-sheets]
  question: Faut-il savoir utiliser Google Sheets ?
  reponse: >-
    Non. Il suffit d'avoir un compte Google gratuit. Un code couleur simple te guide : les
    cases jaunes sont à remplir, les blanches sont libres pour tes notes, et les gris-bleu se
    calculent toutes seules. Elles sont verrouillées, donc impossible de casser une formule.

- id: telephone
  ordre: 2
  pages: [google-sheets]
  question: Puis-je utiliser l'outil sur téléphone ?
  reponse: Oui, via l'application Google Sheets.

- id: reception
  ordre: 3
  pages: [google-sheets]
  question: Comment je reçois l'outil ?
  reponse: >-
    Par e-mail, immédiatement après l'achat, avec un lien pour en faire une copie dans ton
    Google Drive. Avec un accompagnement, la version Complète est incluse (valeur **34 €**) :
    tu la reçois dès ta réservation et elle est à toi, à vie.

- id: securite
  ordre: 4
  pages: [google-sheets]
  question: Mes données sont-elles en sécurité ?
  reponse: >-
    Tes chiffres restent dans ton propre Google Drive. Je n'y ai pas accès, sauf si tu
    choisis de me partager ton fichier dans le cadre d'un accompagnement. Dans ce cas, le partage
    ne dure que le temps de l'accompagnement, tu peux retirer l'accès à tout moment, et tes
    chiffres ne sont jamais transmis à qui que ce soit.

- id: appels
  ordre: 5
  pages: [google-sheets]
  question: Comment se passent les appels ?
  reponse: >-
    En visio, avec partage d'écran. Tu n'as rien à installer en dehors d'un lien de connexion.
    La Prise en main tient en un seul appel de 1h30. Pour l'Accompagnement 3 mois, les 3 appels
    ont lieu à environ un mois d'intervalle, dans les 3 mois qui suivent ton inscription : tu
    réserves chaque créneau selon tes disponibilités.

- id: placements
  ordre: 6
  pages: [google-sheets]
  question: Est-ce que tu me conseilles sur des placements ?
  reponse: >-
    Non. L'accompagnement porte sur l'organisation de ton budget, ton suivi et tes objectifs
    d'épargne. Je ne donne pas de conseil en placement ou en investissement.

- id: remboursement
  ordre: 7
  pages: [google-sheets]
  question: Puis-je être remboursée ?
  # Reprend l'article 8 des CGV (droit de rétractation) : garder les deux textes cohérents.
  reponse: >-
    Pour les outils seuls, non : tu reçois ton fichier tout de suite, et en cochant la case prévue
    au moment du paiement, tu renonces à ton droit de rétractation. Si ton fichier ne fonctionne
    pas (lien inaccessible, formule cassée), écris-moi et je t'en envoie un qui marche. Pour la
    Prise en main et l'Accompagnement 3 mois, tu as **14 jours** pour changer d'avis, sans te
    justifier : il suffit de m'écrire. Je te rembourse alors le prix payé, moins la version
    Complète déjà reçue (34 €) et les appels déjà faits. Tous les détails sont dans les CGV.
