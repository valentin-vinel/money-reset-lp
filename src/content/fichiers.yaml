# ─────────────────────────────────────────────────────────────
#  FICHIERS ENVOYÉS APRÈS L'ACHAT
#  Chaque e-mail (emails.yaml) liste les fichiers qu'il contient, par leur id.
#  • url : lien de partage du fichier. Tant qu'une url est vide, l'e-mail qui
#    la contient n'est pas envoyé (Stripe réessaie pendant 3 jours : il suffit
#    de la compléter et de remettre le site en ligne).
#  • Lien de copie d'un Google Sheets : remplace la fin de l'adresse du fichier
#    (« /edit… ») par « /copy ».
#  • couleurs : un lien par couleur au lieu d'une seule url. Les noms doivent
#    être écrits exactement comme dans la liste déroulante de la page de
#    paiement Stripe ; si la couleur choisie n'est pas trouvée, l'e-mail
#    n'est pas envoyé (Stripe réessaie, le temps de corriger).
#  • PDF : déposé sur Google Drive, partagé « Tous les utilisateurs disposant du lien ».
# ─────────────────────────────────────────────────────────────

