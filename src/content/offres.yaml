- id: essentielle
  ordre: 1
  publie: true
  type: outil
  nom: Essentielle
  prix: 19
  modalite: Paiement unique, accès à vie
  titre: Vois enfin où va ton argent
  resume: >-
    Tout le système Money Reset pour suivre tes revenus, tes dépenses, tes abonnements,
    tes dettes, ton épargne et tes objectifs, avec ton tableau de bord et ton score.
  pourQui:
    - Tu veux commencer à suivre ton budget mais tu ne sais pas par où commencer.
    - Tu cherches un outil clair, sans application payante ni abonnement.
    - Tu es plutôt autonome et tu veux avancer à ton rythme.
  inclus:
    - Démarrage guidé en 6 étapes
    - Dépenses avec catégories automatiques
    - Suivi des revenus
    - Bilan de tes abonnements
    - Suivi de tes dettes
    - Enveloppes d'épargne
    - Objectifs chiffrés
    - Tableau de bord automatique
    - Money Reset Score sur 100
    - Bilan mensuel
    - Outil personnalisable
  change: >-
    En quelques minutes par jour, tu sais combien tu as dépensé, où, et ce qu'il te reste.
    Ton score te montre tes progrès mois après mois, et tes projets ont enfin une date.
